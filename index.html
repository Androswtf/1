<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Маркетинговый калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="hero">
      <h1>Калькулятор услуг маркетинга</h1>
      <p class="tagline">Узнайте стоимость и превратите трафик в продажи</p>
    </header>
    <form id="calc-form">
      <div class="services">
        <label><input type="checkbox" value="5000" name="seo"> SEO оптимизация (5000)</label>
        <label><input type="checkbox" value="4000" name="smm"> SMM продвижение (4000)</label>
        <label><input type="checkbox" value="6000" name="ppc"> PPC реклама (6000)</label>
        <label><input type="checkbox" value="3000" name="content"> Контент-маркетинг (3000)</label>
        <label><input type="checkbox" value="2000" name="email"> Email маркетинг (2000)</label>
      </div>
      <div class="months">
        <label>Количество месяцев: <input type="number" id="months" value="1" min="1"></label>
      </div>
      <div class="tariffs">
        <h2>Выберите тариф</h2>
        <label><input type="checkbox" value="10000" name="starter"> Старт (10000)</label>
        <label><input type="checkbox" value="15000" name="basic"> Базовый (15000)</label>
        <label><input type="checkbox" value="20000" name="advanced"> Продвинутый (20000)</label>
        <label><input type="checkbox" value="25000" name="premium"> Премиум (25000)</label>
        <label><input type="checkbox" value="30000" name="corporate"> Корпоративный (30000)</label>
        <label><input type="checkbox" value="50000" name="vip"> VIP (50000)</label>
      </div>
      <button type="button" id="calculate">Рассчитать</button>
    </form>
    <div class="result" id="result"></div>
    <p class="cta">Заполните форму и получите бесплатную консультацию по увеличению продаж</p>
  </div>
<script src="script.js"></script>
</body>
</html>
